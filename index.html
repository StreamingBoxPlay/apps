<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StreamingBoxPlay -                       Aplicativos e Ferramentas</title>

<style>
    :root {
        --bg-color: #0a0b10;
        --card-bg: #131520;
        --card-hover: #1c1f2e;
        --border-color: #26293d;

        --accent-border: #9333ea;
        --accent-blue: #3b82f6;
        --accent-purple: #9333ea;
        --accent-pink: #ec4899;
        --accent-orange: #f97316;

        --text-main: #f1f1f3;
        --text-muted: #9ca3af;
        --success: #10b981;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;

        font-family:
            'Inter',
            -apple-system,
            BlinkMacSystemFont,
            'Segoe UI',
            Roboto,
            sans-serif;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        background: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    header {
        background-color: rgba(10, 11, 16, 0.88);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);

        border-bottom: 1px solid var(--border-color);

        position: sticky;
        top: 0;
        z-index: 100;

        padding: 1rem 2rem;

        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 20px;
    }

    .logo-container {
        display: flex;
        align-items: center;
        gap: 16px;

        text-decoration: none;
        color: var(--text-main);

        min-width: 0;
    }

    .logo-img-wrapper {
        height: 60px;

        display: flex;
        align-items: center;

        flex-shrink: 0;
    }

    .logo-img-wrapper img {
        height: 100%;
        width: auto;
        max-width: 100px;

        object-fit: contain;
    }

    .logo-text-group {
        display: flex;
        flex-direction: column;
    }

    .logo-title {
        font-size: 1.5rem;
        font-weight: 800;

        letter-spacing: -0.5px;
        line-height: 1.2;

        white-space: nowrap;
    }

    .text-stream {
        color: #3b82f6;
    }

    .text-box {
        background: linear-gradient(
            90deg,
            #9333ea,
            #ec4899
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .text-play {
        background: linear-gradient(
            90deg,
            #ec4899,
            #f97316
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .logo-subtitle {
        font-size: 0.8rem;
        color: var(--text-muted);

        letter-spacing: 0.5px;
    }

    /* =========================
       PESQUISA
    ========================= */

    .search-box {
        position: relative;

        width: 100%;
        max-width: 320px;
    }

    .search-box input {
        width: 100%;

        background-color: var(--card-bg);

        border: 1px solid var(--border-color);
        border-radius: 10px;

        padding: 11px 16px 11px 40px;

        color: var(--text-main);

        font-size: 0.95rem;

        transition: all 0.3s ease;
    }

    .search-box input:focus {
        outline: none;

        border-color: var(--accent-border);

        box-shadow:
            0 0 0 3px rgba(147, 51, 234, 0.15);
    }

    .search-box input::placeholder {
        color: #6b7280;
    }

    .search-box svg {
        position: absolute;

        left: 12px;
        top: 50%;

        transform: translateY(-50%);

        width: 18px;
        height: 18px;

        fill: var(--text-muted);

        pointer-events: none;
    }

    /* =========================
       CONTEÚDO
    ========================= */

    main {
        flex: 1;

        max-width: 1280px;
        width: 100%;

        margin: 0 auto;

        padding: 2.5rem 2rem 4rem;
    }

    /* =========================
       SEÇÕES
    ========================= */

    .content-section {
        margin-bottom: 4rem;
    }

    .section-title {
        font-size: 1.75rem;
        font-weight: 700;

        margin-bottom: 1.5rem;

        letter-spacing: -0.5px;

        color: var(--text-main);

        display: flex;
        align-items: center;
        gap: 10px;
    }

    .section-title::before {
        content: '';

        width: 5px;
        height: 28px;

        border-radius: 5px;

        background:
            linear-gradient(
                180deg,
                var(--accent-purple),
                var(--accent-pink)
            );
    }

    /* =========================
       GRID
    ========================= */

    .apps-grid {
        display: grid;

        grid-template-columns:
            repeat(auto-fill, minmax(260px, 1fr));

        gap: 1.5rem;
    }

    /* =========================
       CARD
    ========================= */

    .app-card {
        background-color: var(--card-bg);

        border: 1px solid var(--accent-border);

        border-radius: 14px;

        padding: 1.5rem;

        cursor: pointer;

        transition:
            transform 0.3s ease,
            background-color 0.3s ease,
            border-color 0.3s ease,
            box-shadow 0.3s ease;

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: space-between;

        text-align: center;

        position: relative;
        overflow: hidden;

        min-height: 245px;

        box-shadow:
            0 4px 15px rgba(147, 51, 234, 0.08);
    }

    .app-card::before {
        content: '';

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 3px;

        background:
            linear-gradient(
                90deg,
                var(--accent-purple),
                var(--accent-pink),
                var(--accent-orange)
            );

        opacity: 0;

        transition: opacity 0.3s ease;
    }

    .app-card:hover {
        transform: translateY(-6px);

        background-color: var(--card-hover);

        border-color: #a855f7;

        box-shadow:
            0 12px 30px -10px
            rgba(147, 51, 234, 0.3);
    }

    .app-card:hover::before {
        opacity: 1;
    }

    /* =========================
       INFORMAÇÕES
    ========================= */

    .app-info {
        width: 100%;
    }

    .app-info h3 {
        font-size: 1.2rem;

        font-weight: 600;

        margin-bottom: 6px;

        color: var(--accent-purple);

        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .app-date {
        font-size: 0.8rem;

        color: var(--accent-orange);

        margin-bottom: 1.2rem;

        font-weight: 500;
    }

    /* =========================
       ÍCONE
    ========================= */

    .app-icon {
        width: 80px;
        height: 80px;

        border-radius: 16px;

        background-color: #1c1f2e;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 2rem;

        overflow: hidden;

        border: 1px solid var(--border-color);

        margin-bottom: 1.5rem;

        box-shadow:
            0 4px 10px rgba(0, 0, 0, 0.3);

        flex-shrink: 0;
    }

    .app-icon img {
        width: 100%;
        height: 100%;

        object-fit: cover;

        display: block;
    }

    /* =========================
       FOOTER DO CARD
    ========================= */

    .card-footer {
        width: 100%;

        padding-top: 1rem;

        border-top: 1px solid var(--border-color);
    }

    .btn-details {
        background-color: transparent;

        color: var(--accent-blue);

        border: 1px solid var(--accent-blue);

        padding: 10px 20px;

        border-radius: 8px;

        font-size: 0.9rem;

        font-weight: 500;

        cursor: pointer;

        transition: all 0.3s ease;

        width: 100%;

        text-align: center;
    }

    .app-card:hover .btn-details {
        background:
            linear-gradient(
                135deg,
                var(--accent-purple),
                var(--accent-pink)
            );

        border-color: transparent;

        color: #fff;

        box-shadow:
            0 4px 15px
            rgba(147, 51, 234, 0.4);
    }

    /* =========================
       CARREGAR MAIS
    ========================= */

    .load-more-container {
        display: flex;

        justify-content: center;

        margin-top: 2rem;
    }

    .load-more-btn {
        background:
            linear-gradient(
                135deg,
                var(--accent-purple),
                var(--accent-pink)
            );

        color: #fff;

        border: none;

        padding: 12px 28px;

        border-radius: 9px;

        font-size: 0.95rem;

        font-weight: 600;

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease,
            opacity 0.2s ease;

        box-shadow:
            0 5px 18px
            rgba(147, 51, 234, 0.25);
    }

    .load-more-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 24px
            rgba(147, 51, 234, 0.4);
    }

    .load-more-btn:active {
        transform: translateY(0);
    }

    .load-more-btn.hidden {
        display: none;
    }

    /* =========================
       STATUS
    ========================= */

    .status-message {
        grid-column: 1 / -1;

        text-align: center;

        padding: 3rem 1rem;

        color: var(--text-muted);

        font-size: 1rem;
    }

    .status-error {
        color: #f87171;
    }

    /* =========================
       MODAL
    ========================= */

    .modal-overlay {
        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100%;

        background-color:
            rgba(5, 6, 9, 0.8);

        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);

        display: flex;

        justify-content: center;
        align-items: center;

        z-index: 1000;

        opacity: 0;
        visibility: hidden;

        transition: all 0.3s ease;

        padding: 20px;
    }

    .modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    .modal-content {
        background-color: #131520;

        border: 1px solid var(--accent-border);

        border-radius: 18px;

        width: 100%;
        max-width: 480px;

        padding: 2rem;

        position: relative;

        transform: scale(0.95);

        transition:
            transform 0.3s
            cubic-bezier(0.4, 0, 0.2, 1);

        box-shadow:
            0 25px 50px -12px
            rgba(147, 51, 234, 0.3);

        max-height: 90vh;

        overflow-y: auto;
    }

    .modal-overlay.active .modal-content {
        transform: scale(1);
    }

    .modal-close {
        position: absolute;

        top: 1.25rem;
        right: 1.25rem;

        background: #1c1f2e;

        border: none;

        color: var(--text-muted);

        width: 32px;
        height: 32px;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        cursor: pointer;

        transition: all 0.2s;
    }

    .modal-close:hover {
        background-color: #26293d;

        color: var(--text-main);
    }

    .modal-header {
        display: flex;

        align-items: center;

        gap: 16px;

        margin-bottom: 1.25rem;

        padding-right: 35px;
    }

    .modal-icon {
        width: 64px;
        height: 64px;

        border-radius: 14px;

        background: #1c1f2e;

        overflow: hidden;

        display: flex;

        align-items: center;
        justify-content: center;

        font-size: 2rem;

        border: 1px solid var(--border-color);

        flex-shrink: 0;
    }

    .modal-icon img {
        width: 100%;
        height: 100%;

        object-fit: cover;

        display: block;
    }

    .modal-title-area {
        min-width: 0;
    }

    .modal-title-area h2 {
        font-size: 1.25rem;

        font-weight: 600;

        margin-bottom: 4px;

        color: var(--accent-purple);

        word-break: break-word;
    }

    .modal-meta {
        font-size: 0.85rem;

        color: var(--text-muted);
    }

    .modal-sections {
        display: flex;

        flex-direction: column;

        gap: 16px;

        margin-top: 1rem;
    }

    .section-box {
        background-color: #1c1f2e;

        border: 1px solid var(--border-color);

        border-radius: 12px;

        padding: 12px;
    }

    .section-label {
        font-size: 0.8rem;

        color: var(--text-muted);

        margin-bottom: 6px;

        font-weight: 500;

        text-transform: uppercase;

        letter-spacing: 0.5px;
    }

    .action-row {
        display: flex;

        gap: 8px;
    }

    .copy-input {
        flex: 1;

        min-width: 0;

        background-color: var(--bg-color);

        border: 1px solid var(--border-color);

        border-radius: 8px;

        padding: 8px 12px;

        color: var(--text-muted);

        font-size: 0.85rem;

        outline: none;
    }

    .btn-copy {
        background-color: #26293d;

        color: var(--text-main);

        border: 1px solid var(--border-color);

        border-radius: 8px;

        padding: 0 14px;

        font-size: 0.85rem;

        font-weight: 500;

        cursor: pointer;

        transition: all 0.2s;

        white-space: nowrap;
    }

    .btn-copy:hover {
        background-color: #3f3f46;
    }

    .btn-download-primary {
        background:
            linear-gradient(
                135deg,
                var(--accent-purple),
                var(--accent-pink)
            );

        color: white;

        border: none;

        border-radius: 8px;

        padding: 10px;

        font-size: 0.9rem;

        font-weight: 600;

        cursor: pointer;

        text-align: center;

        text-decoration: none;

        transition: opacity 0.2s;

        display: flex;

        align-items: center;
        justify-content: center;

        gap: 8px;

        width: 100%;

        margin-top: 8px;

        box-shadow:
            0 4px 12px
            rgba(147, 51, 234, 0.3);
    }

    .btn-download-primary:hover {
        opacity: 0.9;
    }

    /* =========================
       RESPONSIVO
    ========================= */

    @media (max-width: 900px) {

        header {
            padding: 1rem 1.25rem;
        }

        main {
            padding:
                2rem 1.25rem 3rem;
        }

        .apps-grid {
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 600px) {

        header {
            flex-direction: column;

            gap: 1rem;

            align-items: stretch;
        }

        .logo-container {
            justify-content: center;
        }

        .search-box {
            max-width: 100%;
        }

        .logo-img-wrapper {
            height: 50px;
        }

        .logo-title {
            font-size: 1.25rem;
        }

        .logo-subtitle {
            font-size: 0.7rem;
        }

        main {
            padding:
                1.5rem 1rem 3rem;
        }

        .section-title {
            font-size: 1.4rem;

            margin-bottom: 1.2rem;
        }

        .apps-grid {
            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 0.8rem;
        }

        .app-card {
            padding: 1rem;

            min-height: 220px;

            border-radius: 12px;
        }

        .app-icon {
            width: 65px;
            height: 65px;

            margin-bottom: 1rem;
        }

        .app-info h3 {
            font-size: 1rem;
        }

        .app-date {
            font-size: 0.7rem;

            margin-bottom: 1rem;
        }

        .btn-details {
            padding: 8px;

            font-size: 0.8rem;
        }

        .modal-content {
            padding: 1.25rem;

            border-radius: 14px;
        }

        .action-row {
            flex-direction: column;
        }

        .copy-input {
            width: 100%;

            min-height: 38px;
        }

        .btn-copy {
            min-height: 38px;
        }
    }

    @media (max-width: 380px) {

        .apps-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

</head><body><header><a href="#" class="logo-container">

    <div class="logo-img-wrapper">

        <img
            src="icon.png"
            alt="Logo StreamingBoxPlay"
            onerror="this.style.display='none'"
        >

    </div>

    <div class="logo-text-group">

        <span class="logo-title">

            <span class="text-stream">
                Streaming
            </span>

            <span class="text-box">
                Box
            </span>

            <span class="text-play">
                Play
            </span>

        </span>

        <span class="logo-subtitle">
            Seu universo de entretenimento
        </span>

    </div>

</a>


<div class="search-box">

    <svg viewBox="0 0 24 24">

        <path d="
            M15.5 14h-.79l-.28-.27
            A6.471 6.471 0 0 0 16 9.5
            A6.5 6.5 0 1 0 9.5 16
            c1.61 0 3.09-.59 4.23-1.57
            l.27.28v.79l5 4.99
            L20.49 19l-4.99-5zm-6 0
            C7.01 14 5 11.99 5 9.5
            S7.01 5 9.5 5
            14 7.01 14 9.5
            11.99 14 9.5 14z
        "/>

    </svg>

    <input
        type="text"
        id="searchInput"
        placeholder="Pesquisar aplicativos e ferramentas..."
        autocomplete="off"
    >

</div>

</header><main><!-- =========================
     APLICATIVOS
========================== -->

<section class="content-section">

    <h1 class="section-title">
        Aplicativos
    </h1>

    <div
        id="appsGrid"
        class="apps-grid"
    >
        <div class="status-message">
            Carregando aplicativos...
        </div>
    </div>

    <div
        id="appsLoadMoreContainer"
        class="load-more-container hidden"
    >

        <button
            id="appsLoadMore"
            class="load-more-btn"
        >
            Carregar mais
        </button>

    </div>

</section>


<!-- =========================
     FERRAMENTAS
========================== -->

<section class="content-section">

    <h1 class="section-title">
        Ferramentas
    </h1>

    <div
        id="toolsGrid"
        class="apps-grid"
    >
        <div class="status-message">
            Carregando ferramentas...
        </div>
    </div>

    <div
        id="toolsLoadMoreContainer"
        class="load-more-container hidden"
    >

        <button
            id="toolsLoadMore"
            class="load-more-btn"
        >
            Carregar mais
        </button>

    </div>

</section>

</main><!-- =========================
     MODAL
========================== --><div
    id="appModal"
    class="modal-overlay"
><div class="modal-content">

    <button
        class="modal-close"
        id="closeModal"
        aria-label="Fechar"
    >
        ✕
    </button>


    <div class="modal-header">

        <div
            class="modal-icon"
            id="modalIcon"
        >
            📦
        </div>


        <div class="modal-title-area">

            <h2 id="modalName">
                Nome
            </h2>

            <div
                class="modal-meta"
                id="modalMeta"
            >
                StreamingBoxPlay Oficial
            </div>

        </div>

    </div>


    <div class="modal-sections">

        <!-- LINK -->

        <div class="section-box">

            <div class="section-label">
                Link de Download Direto
            </div>

            <div class="action-row">

                <input
                    type="text"
                    id="modalLinkInput"
                    class="copy-input"
                    readonly
                >

                <button
                    class="btn-copy"
                    id="copyLinkBtn"
                >
                    Copiar Link
                </button>

            </div>


            <a
                href="#"
                id="modalDownloadBtn"
                class="btn-download-primary"

            >

                <svg
                    width="16"

                >

                    <path d="

                        a2 2 0 0 1-2-2v-4
                    "/>

                    <polyline points="
                        7 10 12 15 17 10
                    "/>

                    <line
                        x1="12"
                        y1="15"
                        x2="12"
                        y2="3"
                    />

                </svg>

                Baixar Agora

            </a>

        </div>


        <!-- DOWNLOADER -->

        <div class="section-box">

            <div class="section-label">
                Código Downloader
            </div>

            <div class="action-row">

                <input
                    type="text"
                    id="modalDownloaderInput"
                    class="copy-input"
                    readonly
                >

                <button
                    class="btn-copy"
                    id="copyDownloaderBtn"
                >
                    Copiar Código
                </button>

            </div>

        </div>

    </div>

</div>

</div><script>

    /* ==========================================
       CONFIGURAÇÃO
    ========================================== */

    const ITEMS_PER_LOAD = 8;

    /*
       8 cards por carregamento.

       Em computadores:
       normalmente 4 cards por linha
       = 2 linhas.

       Em celulares:
       normalmente 2 cards por linha
       = 4 linhas.

       Se quiser controlar exatamente 2 linhas
       também no celular, podemos adaptar para
       calcular automaticamente pela largura.
    */


    let allApps = [];

    let allTools = [];

    let filteredApps = [];

    let filteredTools = [];

    let appsVisible = ITEMS_PER_LOAD;

    let toolsVisible = ITEMS_PER_LOAD;


    /* ==========================================
       ELEMENTOS
    ========================================== */

    const appsGrid =
        document.getElementById('appsGrid');

    const toolsGrid =
        document.getElementById('toolsGrid');

    const appsLoadMore =
        document.getElementById('appsLoadMore');

    const toolsLoadMore =
        document.getElementById('toolsLoadMore');

    const appsLoadMoreContainer =
        document.getElementById(
            'appsLoadMoreContainer'
        );

    const toolsLoadMoreContainer =
        document.getElementById(
            'toolsLoadMoreContainer'
        );

    const searchInput =
        document.getElementById('searchInput');

    const modal =
        document.getElementById('appModal');


    /* ==========================================
       CARREGAR JSON
    ========================================== */

    async function loadApps() {

        try {

            const response =
                await fetch('app.json');

            if (!response.ok) {
                throw new Error(
                    'Erro ao carregar app.json'
                );
            }

            allApps =
                await response.json();

            filteredApps =
                [...allApps];

            renderApps();

        } catch (error) {

            console.error(error);

            appsGrid.innerHTML = `
                <div class="status-message status-error">
                    Não foi possível carregar os aplicativos.
                    <br><br>
                    Verifique se o arquivo
                    <strong>app.json</strong>
                    está no mesmo diretório.
                </div>
            `;

        }

    }


    async function loadTools() {

        try {

            const response =
                await fetch('tools.json');

            if (!response.ok) {
                throw new Error(
                    'Erro ao carregar tools.json'
                );
            }

            allTools =
                await response.json();

            filteredTools =
                [...allTools];

            renderTools();

        } catch (error) {

            console.error(error);

            toolsGrid.innerHTML = `
                <div class="status-message status-error">
                    Não foi possível carregar as ferramentas.
                    <br><br>
                    Verifique se o arquivo
                    <strong>tools.json</strong>
                    está no mesmo diretório.
                </div>
            `;

        }

    }


    /* ==========================================
       GERAR CARD
    ========================================== */

    function createCard(item, type) {

        const card =
            document.createElement('div');

        card.className = 'app-card';

        card.dataset.id = item.id;

        card.dataset.type = type;


        const nome =
            escapeHtml(
                item.nome || 'Aplicativo'
            );


        const data =
            escapeHtml(
                item.data || '02/09/2026'
            );


        const icon =
            item.icone
                ? `
                    <img
                        src="${escapeAttribute(item.icone)}"
                        alt="${nome}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement.textContent='📦';
                        "
                    >
                  `
                : '📦';


        card.innerHTML = `

            <div class="app-info">

                <h3>
                    ${nome}
                </h3>

                <div class="app-date">
                    Atualizado em: ${data}
                </div>

            </div>


            <div class="app-icon">

                ${icon}

            </div>


            <div class="card-footer">

                <button
                    class="btn-details"
                    type="button"
                >
                    Ver Detalhes
                </button>

            </div>

        `;


        card.addEventListener(
            'click',
            () => openModal(item, type)
        );


        return card;

    }


    /* ==========================================
       RENDER APLICATIVOS
    ========================================== */

    function renderApps() {

        appsGrid.innerHTML = '';

        const visible =
            filteredApps.slice(
                0,
                appsVisible
            );


        if (visible.length === 0) {

            appsGrid.innerHTML = `
                <div class="status-message">
                    Nenhum aplicativo encontrado.
                </div>
            `;

        } else {

            const fragment =
                document.createDocumentFragment();


            visible.forEach(app => {

                fragment.appendChild(
                    createCard(
                        app,
                        'app'
                    )
                );

            });


            appsGrid.appendChild(fragment);

        }


        updateLoadMoreButton(
            filteredApps,
            appsVisible,
            appsLoadMoreContainer
        );

    }


    /* ==========================================
       RENDER FERRAMENTAS
    ========================================== */

    function renderTools() {

        toolsGrid.innerHTML = '';

        const visible =
            filteredTools.slice(
                0,
                toolsVisible
            );


        if (visible.length === 0) {

            toolsGrid.innerHTML = `
                <div class="status-message">
                    Nenhuma ferramenta encontrada.
                </div>
            `;

        } else {

            const fragment =
                document.createDocumentFragment();


            visible.forEach(tool => {

                fragment.appendChild(
                    createCard(
                        tool,
                        'tool'
                    )
                );

            });


            toolsGrid.appendChild(fragment);

        }


        updateLoadMoreButton(
            filteredTools,
            toolsVisible,
            toolsLoadMoreContainer
        );

    }


    /* ==========================================
       BOTÃO CARREGAR MAIS
    ========================================== */

    function updateLoadMoreButton(
        items,
        visible,
        container
    ) {

        if (visible < items.length) {

            container.classList.remove(
                'hidden'
            );

        } else {

            container.classList.add(
                'hidden'
            );

        }

    }


    appsLoadMore.addEventListener(
        'click',
        () => {

            appsVisible +=
                ITEMS_PER_LOAD;

            renderApps();

        }
    );


    toolsLoadMore.addEventListener(
        'click',
        () => {

            toolsVisible +=
                ITEMS_PER_LOAD;

            renderTools();

        }
    );


    /* ==========================================
       PESQUISA
    ========================================== */

    let searchTimeout;


    searchInput.addEventListener(
        'input',
        () => {

            clearTimeout(
                searchTimeout
            );


            searchTimeout =
                setTimeout(
                    performSearch,
                    150
                );

        }
    );


    function performSearch() {

        const term =
            searchInput.value
                .trim()
                .toLowerCase();


        if (!term) {

            filteredApps =
                [...allApps];

            filteredTools =
                [...allTools];

        } else {

            filteredApps =
                allApps.filter(
                    item =>
                        String(
                            item.nome || ''
                        )
                        .toLowerCase()
                        .includes(term)
                );


            filteredTools =
                allTools.filter(
                    item =>
                        String(
                            item.nome || ''
                        )
                        .toLowerCase()
                        .includes(term)
                );

        }


        /*
           Quando pesquisar, mostramos
           os primeiros resultados novamente.
        */

        appsVisible =
            ITEMS_PER_LOAD;

        toolsVisible =
            ITEMS_PER_LOAD;


        renderApps();

        renderTools();

    }


    /* ==========================================
       MODAL
    ========================================== */

    function openModal(
        item,
        type
    ) {

        document.getElementById(
            'modalName'
        ).textContent =
            item.nome || 'Aplicativo';


        document.getElementById(
            'modalMeta'
        ).textContent =
            type === 'tool'
                ? 'Ferramenta StreamingBoxPlay'
                : 'StreamingBoxPlay Oficial';


        document.getElementById(
            'modalLinkInput'
        ).value =
            item.linkDownload || '';


        document.getElementById(
            'modalDownloadBtn'
        ).href =
            item.linkDownload || '#';


        document.getElementById(
            'modalDownloaderInput'
        ).value =
            item.downloader || '';


        const iconContainer =
            document.getElementById(
                'modalIcon'
            );


        if (item.icone) {

            iconContainer.innerHTML = `
                <img
                    src="${escapeAttribute(item.icone)}"
                    alt="${escapeAttribute(item.nome || '')}"
                    onerror="
                        this.style.display='none';
                        this.parentElement.textContent='📦';
                    "
                >
            `;

        } else {

            iconContainer.innerHTML =
                '📦';

        }


        modal.classList.add(
            'active'
        );


        document.body.style.overflow =
            'hidden';

    }


    function closeModal() {

        modal.classList.remove(
            'active'
        );

        document.body.style.overflow =
            '';

    }


    document.getElementById(
        'closeModal'
    ).addEventListener(
        'click',
        closeModal
    );


    modal.addEventListener(
        'click',
        event => {

            if (
                event.target === modal
            ) {

                closeModal();

            }

        }
    );


    document.addEventListener(
        'keydown',
        event => {

            if (
                event.key === 'Escape'
            ) {

                closeModal();

            }

        }
    );


    /* ==========================================
       COPIAR
    ========================================== */

    document.getElementById(
        'copyLinkBtn'
    ).addEventListener(
        'click',
        async () => {

            const input =
                document.getElementById(
                    'modalLinkInput'
                );

            await copyText(
                input.value,
                document.getElementById(
                    'copyLinkBtn'
                ),
                'Copiado!'
            );

        }
    );


    document.getElementById(
        'copyDownloaderBtn'
    ).addEventListener(
        'click',
        async () => {

            const input =
                document.getElementById(
                    'modalDownloaderInput'
                );

            await copyText(
                input.value,
                document.getElementById(
                    'copyDownloaderBtn'
                ),
                'Copiado!'
            );

        }
    );


    async function copyText(
        text,
        button,
        successText
    ) {

        if (!text) {
            return;
        }


        try {

            await navigator.clipboard.writeText(
                text
            );

        } catch {

            const textarea =
                document.createElement(
                    'textarea'
                );

            textarea.value = text;

            document.body.appendChild(
                textarea
            );

            textarea.select();

            document.execCommand(
                'copy'
            );

            textarea.remove();

        }


        const original =
            button.textContent;


        button.textContent =
            successText;

        button.style.backgroundColor =
            '#10b981';

        button.style.color =
            '#fff';


        setTimeout(
            () => {

                button.textContent =
                    original;

                button.style.backgroundColor =
                    '';

                button.style.color =
                    '';

            },
            2000
        );

    }


    /* ==========================================
       SEGURANÇA
       Evita inserir diretamente nomes
       do JSON como HTML.
    ========================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(
                /&/g,
                '&amp;'
            )
            .replace(
                /</g,
                '&lt;'
            )
            .replace(
                />/g,
                '&gt;'
            )
            .replace(
                /"/g,
                '&quot;'
            )
            .replace(
                /'/g,
                '&#039;'
            );

    }


    function escapeAttribute(value) {

        return escapeHtml(value);

    }


    /* ==========================================
       INICIALIZAÇÃO
       
       Os dois JSONs são carregados
       simultaneamente para agilizar
       o carregamento inicial.
    ========================================== */

    Promise.all([
        loadApps(),
        loadTools()
    ]);

</script></body>
</html>
