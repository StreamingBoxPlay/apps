<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0b10">
    <title>StreamingBoxPlay - Download de Aplicativos</title>

    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: #131520;
            --card-hover: #1c1f2e;
            --border-color: #26293d;
            --text-main: #f1f1f3;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-purple: #9333ea;
            --accent-pink: #ec4899;
            --accent-orange: #f97316;
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 11, 16, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-container {
            max-width: 1200px;
            margin: auto;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 220px;
        }

        .brand img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            object-fit: cover;
        }

        .brand-info h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-info span {
            display: block;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 3px;
        }

        /* BUSCA */
        .search-box {
            flex: 1;
            max-width: 450px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 13px 16px;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .search-box input:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px rgba(147, 51, 234, .12);
        }

        .search-box input::placeholder {
            color: var(--text-muted);
        }

        /* MAIN */
        main {
            max-width: 1200px;
            margin: auto;
            padding: 35px 20px 60px;
        }

        .content-section {
            margin-bottom: 60px;
        }

        /* TÍTULOS */
        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            color: var(--text-main);
        }

        /* GRID */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 18px;
        }

        /* CARD */
        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 18px;
            cursor: pointer;
            transition:
                transform .2s ease,
                background .2s ease,
                border-color .2s ease;
        }

        .app-card:hover {
            background: var(--card-hover);
            border-color: var(--accent-purple);
            transform: translateY(-3px);
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 15px;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            object-fit: cover;
            background: #0d0e14;
            flex-shrink: 0;
        }

        .card-info {
            min-width: 0;
        }

        .card-info h3 {
            font-size: 16px;
            color: var(--accent-purple);
            margin-bottom: 7px;
            word-break: break-word;
        }

        .card-date {
            color: var(--accent-orange);
            font-size: 12px;
        }

        .card-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 14px;
        }

        .details-btn {
            width: 100%;
            border: 0;
            border-radius: 9px;
            padding: 11px;
            color: white;
            background: linear-gradient(
                135deg,
                var(--accent-purple),
                var(--accent-pink)
            );
            font-weight: 600;
            cursor: pointer;
        }

        /* CARREGAR MAIS */
        .load-more-container {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }

        .load-more-btn {
            border: 1px solid var(--accent-purple);
            background: linear-gradient(
                135deg,
                rgba(147, 51, 234, .18),
                rgba(236, 72, 153, .12)
            );
            color: white;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .load-more-btn:hover {
            background: linear-gradient(
                135deg,
                var(--accent-purple),
                var(--accent-pink)
            );
            transform: translateY(-2px);
        }

        .load-more-btn.hidden {
            display: none;
        }

        /* STATUS */
        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 35px 15px;
            color: var(--text-muted);
        }

        .error-message {
            color: #ef4444;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, .75);
            backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            background: #11131d;
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 25px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        .close-modal {
            position: absolute;
            top: 14px;
            right: 16px;
            width: 35px;
            height: 35px;
            border: 0;
            border-radius: 50%;
            background: #202332;
            color: white;
            font-size: 22px;
            cursor: pointer;
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 40px;
            margin-bottom: 22px;
        }

        .modal-header img {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            object-fit: cover;
        }

        .modal-header h2 {
            font-size: 20px;
            word-break: break-word;
        }

        .modal-meta {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 5px;
        }

        .modal-group {
            margin-bottom: 18px;
        }

        .modal-group label {
            display: block;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        .input-copy {
            display: flex;
            gap: 8px;
        }

        .input-copy input {
            flex: 1;
            min-width: 0;
            background: #0a0b10;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 11px;
            border-radius: 8px;
            outline: none;
        }

        .copy-btn {
            border: 0;
            background: var(--accent-blue);
            color: white;
            border-radius: 8px;
            padding: 0 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .download-btn {
            display: block;
            width: 100%;
            text-align: center;
            text-decoration: none;
            background: linear-gradient(
                135deg,
                var(--accent-purple),
                var(--accent-pink)
            );
            color: white;
            padding: 13px;
            border-radius: 9px;
            font-weight: 700;
            margin-top: 10px;
        }

        /* MOBILE */
        @media (max-width: 700px) {

            .header-container {
                flex-direction: column;
                align-items: stretch;
            }

            .brand {
                justify-content: center;
            }

            .search-box {
                max-width: none;
            }

            main {
                padding: 28px 15px 50px;
            }

            .section-title {
                font-size: 1.5rem;
                margin-bottom: 22px;
            }

            .apps-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .app-card {
                padding: 13px;
            }

            .card-top {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .app-icon {
                width: 70px;
                height: 70px;
            }

            .card-info h3 {
                font-size: 14px;
            }

            .details-btn {
                font-size: 12px;
                padding: 10px;
            }

            .load-more-btn {
                width: 100%;
                max-width: 280px;
            }
        }

        @media (max-width: 380px) {

            .apps-grid {
                grid-template-columns: 1fr;
            }

            .card-top {
                flex-direction: row;
                text-align: left;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-container">

        <div class="brand">

            <img
                src="icon.png"
                alt="StreamingBoxPlay"
            >

            <div class="brand-info">

                <h2>StreamingBoxPlay</h2>

                <span>
                    Seu universo de entretenimento
                </span>

            </div>

        </div>


        <div class="search-box">

            <input
                type="search"
                id="searchInput"
                placeholder="Pesquisar aplicativos ou ferramentas..."
                autocomplete="off"
            >

        </div>

    </div>

</header>


<main>

    <!-- APLICATIVOS -->

    <section class="content-section">

        <h1 class="section-title">
            Aplicativos disponíveis
        </h1>

        <div
            id="appsGrid"
            class="apps-grid"
        >
            <div class="status-message">
                Carregando aplicativos...
            </div>
        </div>

        <div
            id="appsLoadMoreContainer"
            class="load-more-container"
        >
            <button
                id="appsLoadMore"
                class="load-more-btn"
            >
                Carregar mais
            </button>
        </div>

    </section>


    <!-- FERRAMENTAS -->

    <section class="content-section">

        <h1 class="section-title">
            Ferramentas
        </h1>

        <div
            id="toolsGrid"
            class="apps-grid"
        >
            <div class="status-message">
                Carregando ferramentas...
            </div>
        </div>

        <div
            id="toolsLoadMoreContainer"
            class="load-more-container"
        >
            <button
                id="toolsLoadMore"
                class="load-more-btn"
            >
                Carregar mais
            </button>
        </div>

    </section>

</main>


<!-- MODAL -->

<div
    class="modal"
    id="appModal"
>

    <div class="modal-content">

        <button
            class="close-modal"
            id="closeModal"
        >
            ×
        </button>


        <div class="modal-header">

            <img
                id="modalIcon"
                src=""
                alt=""
            >

            <div>

                <h2 id="modalName"></h2>

                <div
                    class="modal-meta"
                    id="modalMeta"
                ></div>

            </div>

        </div>


        <div class="modal-group">

            <label>
                Link para download
            </label>

            <div class="input-copy">

                <input
                    type="text"
                    id="modalLinkInput"
                    readonly
                >

                <button
                    class="copy-btn"
                    id="copyLinkBtn"
                >
                    Copiar
                </button>

            </div>


            <a
                href="#"
                target="_blank"
                class="download-btn"
                id="modalDownloadBtn"
            >
                Baixar aplicativo
            </a>

        </div>


        <div class="modal-group">

            <label>
                Código Downloader
            </label>

            <div class="input-copy">

                <input
                    type="text"
                    id="modalDownloaderInput"
                    readonly
                >

                <button
                    class="copy-btn"
                    id="copyDownloaderBtn"
                >
                    Copiar
                </button>

            </div>

        </div>

    </div>

</div>


<script>

    /* =========================
       CONFIGURAÇÃO
    ========================= */

    const ITEMS_PER_LOAD = 8;


    let apps = [];
    let tools = [];

    let appsVisible = ITEMS_PER_LOAD;
    let toolsVisible = ITEMS_PER_LOAD;

    let filteredApps = [];
    let filteredTools = [];


    /* =========================
       ELEMENTOS
    ========================= */

    const appsGrid =
        document.getElementById("appsGrid");

    const toolsGrid =
        document.getElementById("toolsGrid");

    const searchInput =
        document.getElementById("searchInput");

    const appsLoadMore =
        document.getElementById("appsLoadMore");

    const toolsLoadMore =
        document.getElementById("toolsLoadMore");


    const modal =
        document.getElementById("appModal");

    const closeModal =
        document.getElementById("closeModal");

    const modalIcon =
        document.getElementById("modalIcon");

    const modalName =
        document.getElementById("modalName");

    const modalMeta =
        document.getElementById("modalMeta");

    const modalLinkInput =
        document.getElementById("modalLinkInput");

    const modalDownloadBtn =
        document.getElementById("modalDownloadBtn");

    const modalDownloaderInput =
        document.getElementById("modalDownloaderInput");

    const copyLinkBtn =
        document.getElementById("copyLinkBtn");

    const copyDownloaderBtn =
        document.getElementById("copyDownloaderBtn");


    /* =========================
       ESCAPAR HTML
    ========================= */

    function escapeHTML(value) {

        if (
            value === null ||
            value === undefined
        ) {
            return "";
        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    /* =========================
       CRIAR CARD
    ========================= */

    function createCard(item, type) {

        const card =
            document.createElement("div");

        card.className = "app-card";


        card.innerHTML = `

            <div class="card-top">

                <img
                    class="app-icon"
                    src="${escapeHTML(item.icone)}"
                    alt="${escapeHTML(item.nome)}"
                    loading="lazy"
                    decoding="async"
                >

                <div class="card-info">

                    <h3>
                        ${escapeHTML(item.nome)}
                    </h3>

                    <div class="card-date">
                        ${escapeHTML(item.data || "")}
                    </div>

                </div>

            </div>


            <div class="card-footer">

                <button class="details-btn">
                    Ver Detalhes
                </button>

            </div>
        `;


        card.addEventListener(
            "click",
            () => openModal(item, type)
        );


        return card;
    }


    /* =========================
       RENDERIZAR APLICATIVOS
    ========================= */

    function renderApps() {

        const fragment =
            document.createDocumentFragment();

        appsGrid.innerHTML = "";


        if (!filteredApps.length) {

            appsGrid.innerHTML = `
                <div class="status-message">
                    Nenhum aplicativo encontrado.
                </div>
            `;

            updateAppsButton();

            return;
        }


        const items =
            filteredApps.slice(0, appsVisible);


        items.forEach(item => {

            fragment.appendChild(
                createCard(item, "app")
            );

        });


        appsGrid.appendChild(fragment);

        updateAppsButton();
    }


    /* =========================
       RENDERIZAR FERRAMENTAS
    ========================= */

    function renderTools() {

        const fragment =
            document.createDocumentFragment();

        toolsGrid.innerHTML = "";


        if (!filteredTools.length) {

            toolsGrid.innerHTML = `
                <div class="status-message">
                    Nenhuma ferramenta encontrada.
                </div>
            `;

            updateToolsButton();

            return;
        }


        const items =
            filteredTools.slice(0, toolsVisible);


        items.forEach(item => {

            fragment.appendChild(
                createCard(item, "tool")
            );

        });


        toolsGrid.appendChild(fragment);

        updateToolsButton();
    }


    /* =========================
       BOTÃO APLICATIVOS
    ========================= */

    function updateAppsButton() {

        if (
            appsVisible >= filteredApps.length ||
            filteredApps.length === 0
        ) {

            appsLoadMore.classList.add("hidden");

        } else {

            appsLoadMore.classList.remove("hidden");

        }
    }


    /* =========================
       BOTÃO FERRAMENTAS
    ========================= */

    function updateToolsButton() {

        if (
            toolsVisible >= filteredTools.length ||
            filteredTools.length === 0
        ) {

            toolsLoadMore.classList.add("hidden");

        } else {

            toolsLoadMore.classList.remove("hidden");

        }
    }


    /* =========================
       CARREGAR MAIS APLICATIVOS
    ========================= */

    appsLoadMore.addEventListener(
        "click",
        function () {

            appsVisible += ITEMS_PER_LOAD;

            renderApps();

        }
    );


    /* =========================
       CARREGAR MAIS FERRAMENTAS
    ========================= */

    toolsLoadMore.addEventListener(
        "click",
        function () {

            toolsVisible += ITEMS_PER_LOAD;

            renderTools();

        }
    );


    /* =========================
       CARREGAR JSON
    ========================= */

    async function loadData() {

        try {

            const [
                appsResponse,
                toolsResponse
            ] = await Promise.all([

                fetch("app.json", {
                    cache: "no-cache"
                }),

                fetch("tools.json", {
                    cache: "no-cache"
                })

            ]);


            if (!appsResponse.ok) {

                throw new Error(
                    "Erro ao carregar app.json"
                );

            }


            if (!toolsResponse.ok) {

                throw new Error(
                    "Erro ao carregar tools.json"
                );

            }


            const appsData =
                await appsResponse.json();

            const toolsData =
                await toolsResponse.json();


            apps =
                Array.isArray(appsData)
                    ? appsData
                    : [];


            tools =
                Array.isArray(toolsData)
                    ? toolsData
                    : [];


            filteredApps = [...apps];
            filteredTools = [...tools];


            appsVisible = ITEMS_PER_LOAD;
            toolsVisible = ITEMS_PER_LOAD;


            renderApps();
            renderTools();


        } catch (error) {

            console.error(error);


            appsGrid.innerHTML = `
                <div class="status-message error-message">
                    Erro ao carregar os aplicativos.
                </div>
            `;


            toolsGrid.innerHTML = `
                <div class="status-message error-message">
                    Erro ao carregar as ferramentas.
                </div>
            `;

        }

    }


    /* =========================
       PESQUISA
    ========================= */

    searchInput.addEventListener(
        "input",
        function () {

            const search =
                this.value
                    .trim()
                    .toLowerCase();


            if (!search) {

                filteredApps = [...apps];
                filteredTools = [...tools];

            } else {

                filteredApps =
                    apps.filter(item => {

                        const nome =
                            String(item.nome || "")
                                .toLowerCase();

                        const data =
                            String(item.data || "")
                                .toLowerCase();

                        return (
                            nome.includes(search) ||
                            data.includes(search)
                        );

                    });


                filteredTools =
                    tools.filter(item => {

                        const nome =
                            String(item.nome || "")
                                .toLowerCase();

                        const data =
                            String(item.data || "")
                                .toLowerCase();

                        return (
                            nome.includes(search) ||
                            data.includes(search)
                        );

                    });

            }


            /*
             * Ao pesquisar, começa novamente
             * pelos primeiros 8 resultados.
             */

            appsVisible = ITEMS_PER_LOAD;
            toolsVisible = ITEMS_PER_LOAD;


            renderApps();
            renderTools();

        }
    );


    /* =========================
       ABRIR MODAL
    ========================= */

    function openModal(item, type) {

        modalIcon.src =
            item.icone || "";

        modalIcon.alt =
            item.nome || "";


        modalName.textContent =
            item.nome || "Aplicativo";


        modalMeta.textContent =
            type === "tool"
                ? "Ferramenta StreamingBoxPlay"
                : "StreamingBoxPlay Oficial";


        modalLinkInput.value =
            item.linkDownload || "";


        modalDownloaderInput.value =
            item.downloader || "";


        modalDownloadBtn.href =
            item.linkDownload || "#";


        modal.classList.add("active");

        document.body.style.overflow =
            "hidden";
    }


    /* =========================
       FECHAR MODAL
    ========================= */

    function closeAppModal() {

        modal.classList.remove("active");

        document.body.style.overflow = "";
    }


    closeModal.addEventListener(
        "click",
        closeAppModal
    );


    modal.addEventListener(
        "click",
        function(event) {

            if (
                event.target === modal
            ) {
                closeAppModal();
            }

        }
    );


    document.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Escape"
            ) {
                closeAppModal();
            }

        }
    );


    /* =========================
       COPIAR LINK
    ========================= */

    copyLinkBtn.addEventListener(
        "click",
        async function() {

            try {

                await navigator.clipboard.writeText(
                    modalLinkInput.value
                );


                const original =
                    this.textContent;


                this.textContent =
                    "Copiado!";


                setTimeout(() => {

                    this.textContent =
                        original;

                }, 1500);


            } catch (error) {

                modalLinkInput.select();

                document.execCommand("copy");

            }

        }
    );


    /* =========================
       COPIAR DOWNLOADER
    ========================= */

    copyDownloaderBtn.addEventListener(
        "click",
        async function() {

            try {

                await navigator.clipboard.writeText(
                    modalDownloaderInput.value
                );


                const original =
                    this.textContent;


                this.textContent =
                    "Copiado!";


                setTimeout(() => {

                    this.textContent =
                        original;

                }, 1500);


            } catch (error) {

                modalDownloaderInput.select();

                document.execCommand("copy");

            }

        }
    );


    /* =========================
       INICIAR
    ========================= */

    loadData();

</script>

</body>
</html>
