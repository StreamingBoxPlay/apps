<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamBoxPlay - Download de Aplicativos</title>
    <style>
        :root {
            --bg-color: #0a0b10;
            --card-bg: #131520;
            --card-hover: #1c1f2e;
            --border-color: #26293d;
            --accent-border: #9333ea;
            --text-main: #f1f1f3;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-purple: #9333ea;
            --accent-pink: #ec4899;
            --accent-orange: #f97316;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: rgba(10, 11, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-img-wrapper {
            height: 60px;
            display: flex;
            align-items: center;
        }

        .logo-img-wrapper img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .logo-text-group {
            display: flex;
            flex-direction: column;
        }

        .logo-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .text-stream {
            color: #3b82f6;
        }

        .text-box {
            background: linear-gradient(90deg, #9333ea, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .text-play {
            background: linear-gradient(90deg, #ec4899, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-box input {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 16px 10px 40px;
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent-border);
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.15);
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            fill: var(--text-muted);
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1280px;
            width: 100%;
            margin: 0 auto;
            padding: 2.5rem 2rem;
        }

        .section-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
            text-align: center;
            color: var(--text-main);
        }

        /* Grid de Cards */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .app-card {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-border);
            border-radius: 14px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.1);
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-pink), var(--accent-orange));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-6px);
            background-color: var(--card-hover);
            border-color: #a855f7;
            box-shadow: 0 12px 30px -10px rgba(147, 51, 234, 0.3);
        }

        .app-card:hover::before {
            opacity: 1;
        }

        /* Título do aplicativo na cor roxa da logo */
        .app-info h3 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--accent-purple);
        }

        .app-date {
            font-size: 0.8rem;
            color: var(--accent-orange);
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            background-color: #1c1f2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            overflow: hidden;
            border: 1px solid var(--border-color);
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .app-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-footer {
            width: 100%;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .btn-details {
            background-color: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
        }

        .app-card:hover .btn-details {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 6, 9, 0.8);
            backdrop-filter: blur(6px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #131520;
            border: 1px solid var(--accent-border);
            border-radius: 18px;
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 25px 50px -12px rgba(147, 51, 234, 0.3);
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-close {
            position: absolute;
            top: 1.25rem;
            right: 1.25rem;
            background: #1c1f2e;
            border: none;
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background-color: #26293d;
            color: var(--text-main);
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 1.25rem;
        }

        .modal-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            background: #1c1f2e;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid var(--border-color);
        }

        .modal-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-title-area h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--accent-purple);
        }

        .modal-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .modal-sections {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 1rem;
        }

        .section-box {
            background-color: #1c1f2e;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
        }

        .section-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }

        .copy-input {
            flex: 1;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            outline: none;
        }

        .btn-copy {
            background-color: #26293d;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 0 14px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background-color: #3f3f46;
        }

        .btn-download-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: opacity 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
        }

        .btn-download-primary:hover {
            opacity: 0.9;
        }

        .status-message {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                align-items: stretch;
            }
            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <div class="logo-img-wrapper">
                <img src="icon.png" alt="Logo StreamBoxPlay" onerror="this.style.display='none'">
            </div>
            <div class="logo-text-group">
                <span class="logo-title">
                    <span class="text-stream">Stream</span><span class="text-box">Box</span><span class="text-play">Play</span>
                </span>
                <span class="logo-subtitle">Seu universo de entretenimento</span>
            </div>
        </a>
        <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            <input type="text" id="searchInput" placeholder="Pesquisar aplicativos...">
        </div>
    </header>

    <main>
        <h1 class="section-title">Aplicativos Disponíveis</h1>
        <div id="appsGrid" class="apps-grid">
            <div class="status-message">Carregando aplicativos...</div>
        </div>
    </main>

    <!-- Modal -->
    <div id="appModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">✕</button>
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon">📦</div>
                <div class="modal-title-area">
                    <h2 id="modalName">Nome do App</h2>
                    <div class="modal-meta" id="modalMeta">StreamBoxPlay Oficial</div>
                </div>
            </div>
            
            <div class="modal-sections">
                <!-- Seção Link Normal -->
                <div class="section-box">
                    <div class="section-label">Link de Download Direto</div>
                    <div class="action-row">
                        <input type="text" id="modalLinkInput" class="copy-input" readonly>
                        <button class="btn-copy" id="copyLinkBtn">Copiar Link</button>
                    </div>
                    <a href="#" id="modalDownloadBtn" class="btn-download-primary" target="_blank">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Baixar Agora
                    </a>
                </div>

                <!-- Seção Downloader -->
                <div class="section-box">
                    <div class="section-label">Código Downloader</div>
                    <div class="action-row">
                        <input type="text" id="modalDownloaderInput" class="copy-input" readonly>
                        <button class="btn-copy" id="copyDownloaderBtn">Copiar Código</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let allApps = [];

        async function loadApps() {
            try {
                const response = await fetch('app.json');
                if (!response.ok) throw new Error('Erro ao carregar app.json');
                allApps = await response.json();
                renderApps(allApps);
            } catch (error) {
                console.error(error);
                document.getElementById('appsGrid').innerHTML = `
                    <div class="status-message">
                        Não foi possível carregar os aplicativos. Verifique se o arquivo <strong>app.json</strong> está no mesmo diretório.
                    </div>
                `;
            }
        }

        function renderApps(apps) {
            const grid = document.getElementById('appsGrid');
            if (apps.length === 0) {
                grid.innerHTML = '<div class="status-message">Nenhum aplicativo encontrado.</div>';
                return;
            }

            grid.innerHTML = apps.map(app => `
                <div class="app-card" onclick="openModal('${app.id}')">
                    <div class="app-info">
                        <h3>${app.nome}</h3>
                        <div class="app-date">Atualizado em: ${app.data || '02/09/2026'}</div>
                    </div>
                    <div class="app-icon">
                        ${app.icone ? `<img src="${app.icone}" alt="${app.nome}" onerror="this.parentElement.innerHTML='📦'">` : '📦'}
                    </div>
                    <div class="card-footer">
                        <button class="btn-details">Ver Detalhes</button>
                    </div>
                </div>
            `).join('');
        }

        const modal = document.getElementById('appModal');
        const closeModalBtn = document.getElementById('closeModal');
        const searchInput = document.getElementById('searchInput');

        function openModal(appId) {
            const app = allApps.find(a => a.id == appId);
            if (!app) return;

            document.getElementById('modalName').textContent = app.nome;
            document.getElementById('modalLinkInput').value = app.linkDownload || '';
            document.getElementById('modalDownloadBtn').href = app.linkDownload || '#';
            document.getElementById('modalDownloaderInput').value = app.downloader || '';
            
            const iconContainer = document.getElementById('modalIcon');
            if (app.icone) {
                iconContainer.innerHTML = `<img src="${app.icone}" alt="${app.nome}" onerror="this.innerHTML='📦'">`;
            } else {
                iconContainer.innerHTML = '📦';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // Copiar Link Normal
        document.getElementById('copyLinkBtn').addEventListener('click', () => {
            const input = document.getElementById('modalLinkInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            const btn = document.getElementById('copyLinkBtn');
            const originalText = btn.textContent;
            btn.textContent = 'Copiado!';
            btn.style.backgroundColor = '#10b981';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.backgroundColor = '';
                btn.style.color = '';
            }, 2000);
        });

        // Copiar Código Downloader
        document.getElementById('copyDownloaderBtn').addEventListener('click', () => {
            const input = document.getElementById('modalDownloaderInput');
            input.select();
            navigator.clipboard.writeText(input.value);
            const btn = document.getElementById('copyDownloaderBtn');
            const originalText = btn.textContent;
            btn.textContent = 'Copiado!';
            btn.style.backgroundColor = '#10b981';
            btn.style.color = '#fff';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.backgroundColor = '';
                btn.style.color = '';
            }, 2000);
        });

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allApps.filter(app => 
                app.nome.toLowerCase().includes(term) || 
                (app.data && app.data.toLowerCase().includes(term))
            );
            renderApps(filtered);
        });

        loadApps();
    </script>
</body>
</html>
